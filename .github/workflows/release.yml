name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, attest, and publish
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches the manifest version
        run: |
          manifest_version="$(jq -r .version manifest.json)"
          if [ "$manifest_version" != "$TAG" ]; then
            echo "Tag $TAG does not match manifest version $manifest_version" >&2
            exit 1
          fi

      - name: Lint the plugin source
        # Tags cut before the lint setup existed carry no lint script, and
        # re-attesting their assets should not re-review their source.
        run: npm run --if-present lint

      - name: Run the test suite
        run: npm test

      - name: Build the plugin
        run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
          else
            gh release create "$TAG" main.js manifest.json styles.css \
              --title "$TAG" --generate-notes
          fi
